; Custom R1 PCB, NOT AI Thinker ESP32-CAM and NOT the example DevKit pin map.
[platformio]
default_envs = gatepass-r1
[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
 adafruit/Adafruit PN532@1.3.4
 adafruit/Adafruit ILI9341@1.6.2
 ricmoo/QRCode@0.0.1
 adafruit/Adafruit BusIO@1.17.4
 adafruit/Adafruit GFX Library@1.13.0
build_flags =
 -DBOARD_HAS_PSRAM
 -DARDUINO_USB_MODE=1
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DGP_R1_BOARD=1
; Normal firmware still requires server opt-in before a lock pulse is accepted.
[env:gatepass-r1]
build_flags = ${env.build_flags} -DGP_ENABLE_ACTUATION=1
[env:gatepass-r1-bench]
build_flags = ${env.build_flags} -DGP_ENABLE_ACTUATION=0
